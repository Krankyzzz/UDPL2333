<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Password tool</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap" style="max-width:640px;padding-top:60px">
<div class="panel"><h2 style="font-size:28px;margin-bottom:10px">FYP password tool</h2>
<p style="color:var(--muted)">Type the new password. Copy the code below into <b>PASS_HASH</b> in <code>fyp.html</code>. Don't upload this tool to your public repo.</p>
<input class="search" id="p" type="text" placeholder="New password" style="margin-bottom:14px">
<textarea id="o" readonly rows="3" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:13px monospace"></textarea></div></div>
<script>
const SALT="udpl2333-fyp|";
document.getElementById("p").addEventListener("input", async e => {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(SALT + e.target.value));
  document.getElementById("o").value = e.target.value ? [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("") : "";
});
</script></body></html>
